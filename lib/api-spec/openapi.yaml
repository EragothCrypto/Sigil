openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sigil — Web3 Trust Layer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sigil
    description: Sigil transaction and contract analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sigil/simulate:
    post:
      operationId: simulateTransaction
      tags: [sigil]
      summary: Simulate a raw transaction before signing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateTransactionBody"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sigil/analyze:
    post:
      operationId: analyzeInput
      tags: [sigil]
      summary: Analyze a transaction hash or contract address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInputBody"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sigil/history:
    get:
      operationId: getAnalysisHistory
      tags: [sigil]
      summary: Get recent analysis history
      parameters:
        - name: limit
          in: query
          schema:
            type: number
          description: Number of results to return
      responses:
        "200":
          description: List of past analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisRecord"

  /sigil/history/{id}:
    get:
      operationId: getAnalysisById
      tags: [sigil]
      summary: Get a specific analysis by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SimulateTransactionBody:
      type: object
      properties:
        rawData:
          type: string
          description: Raw transaction data — hex calldata, JSON tx object, or wallet prompt text
        network:
          type: string
          default: mainnet
        fromAddress:
          type: string
          description: Optional wallet address doing the signing
      required:
        - rawData

    SimulationAssetChange:
      type: object
      properties:
        direction:
          type: string
          enum: [lose, receive, approve]
        asset:
          type: string
          description: Token/asset name e.g. "USDC", "ETH", "NFT #1234"
        amount:
          type: string
          description: Human-readable amount e.g. "250", "unlimited", "0"
        usdValue:
          type: string
          description: Approximate USD value if known
      required:
        - direction
        - asset
        - amount

    SimulationResult:
      type: object
      properties:
        verdict:
          type: string
          enum: [safe, caution, dangerous]
        verdictReason:
          type: string
        summary:
          type: string
          description: One sentence of what this transaction does
        assetChanges:
          type: array
          items:
            $ref: "#/components/schemas/SimulationAssetChange"
          description: What will change in your wallet after signing
        permissionsGranted:
          type: array
          items:
            type: string
          description: Permissions/approvals being granted
        riskScore:
          type: number
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        warnings:
          type: array
          items:
            type: string
        inputType:
          type: string
          description: What kind of input was detected e.g. "ERC-20 approve calldata"
      required:
        - verdict
        - verdictReason
        - summary
        - assetChanges
        - permissionsGranted
        - riskScore
        - riskLevel
        - warnings
        - inputType

    AnalyzeInputBody:
      type: object
      properties:
        input:
          type: string
          description: Transaction hash (0x...) or contract address
        network:
          type: string
          description: Ethereum network (mainnet, goerli, etc.)
          default: mainnet
      required:
        - input

    KnownEntity:
      type: object
      properties:
        name:
          type: string
          description: Human-readable protocol name e.g. "Uniswap V3 Router"
        category:
          type: string
          description: Protocol category e.g. "DEX", "Lending", "NFT Marketplace"
        trustLevel:
          type: string
          enum: [trusted, caution, unknown]
        url:
          type: string
          description: Protocol website URL
        description:
          type: string
          description: Short description of what the protocol does
        logoLetter:
          type: string
          description: Single letter to use as logo placeholder
      required:
        - name
        - category
        - trustLevel
        - url
        - description
        - logoLetter

    AnalysisResult:
      type: object
      properties:
        id:
          type: string
        input:
          type: string
        inputType:
          type: string
          enum: [transaction, contract, unknown]
        network:
          type: string
        summary:
          type: string
          description: Plain English summary of what this does
        verdict:
          type: string
          enum: [safe, caution, dangerous]
          description: Should I sign this? clear decision
        verdictReason:
          type: string
          description: Short reason for the verdict e.g. "Grants unlimited spending to an unverified contract"
        riskScore:
          type: number
          description: Risk score from 0 (safe) to 100 (very risky)
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        warnings:
          type: array
          items:
            type: string
        positives:
          type: array
          items:
            type: string
        knownEntity:
          $ref: "#/components/schemas/KnownEntity"
          description: Identified known protocol if the target address is a recognized contract
        details:
          $ref: "#/components/schemas/AnalysisDetails"
        createdAt:
          type: string
      required:
        - id
        - input
        - inputType
        - network
        - summary
        - verdict
        - verdictReason
        - riskScore
        - riskLevel
        - warnings
        - positives
        - createdAt

    AnalysisDetails:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        value:
          type: string
        gasUsed:
          type: string
        methodName:
          type: string
        contractName:
          type: string
        tokenSymbol:
          type: string
        rawData:
          type: object

    AnalysisRecord:
      type: object
      properties:
        id:
          type: string
        input:
          type: string
        inputType:
          type: string
          enum: [transaction, contract, unknown]
        network:
          type: string
        summary:
          type: string
        verdict:
          type: string
          enum: [safe, caution, dangerous]
        verdictReason:
          type: string
        riskScore:
          type: number
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        warnings:
          type: array
          items:
            type: string
        positives:
          type: array
          items:
            type: string
        createdAt:
          type: string
      required:
        - id
        - input
        - inputType
        - network
        - summary
        - verdict
        - verdictReason
        - riskScore
        - riskLevel
        - warnings
        - positives
        - createdAt

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
