openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sigil — Web3 Trust Layer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sigil
    description: Sigil transaction and contract analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sigil/simulate:
    post:
      operationId: simulateTransaction
      tags: [sigil]
      summary: Legacy execution analysis (unavailable)
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateTransactionBody"
      responses:
        "422":
          description: Complete execution analysis is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sigil/simulate-v2:
    post:
      operationId: simulateTransactionV2
      tags: [sigil]
      summary: Bounded read-only transaction feasibility check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateTransactionV2Body"
      responses:
        "200":
          description: Explicit call-check, advisory-only or unavailable report; never signing clearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResultV2"
        "400":
          description: Invalid input or unsupported network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sigil/analyze:
    post:
      operationId: analyzeInput
      tags: [sigil]
      summary: Analyze a transaction hash or contract address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInputBody"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sigil/history:
    get:
      operationId: getAnalysisHistory
      tags: [sigil]
      summary: Get public analysis history
      description: User-submitted analyses are private by default, so this collection is empty unless an explicit public-sharing feature is introduced.
      parameters:
        - name: limit
          in: query
          schema:
            type: number
          description: Number of results to return
      responses:
        "200":
          description: List of past analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisRecord"

  /sigil/history/{id}:
    get:
      operationId: getAnalysisById
      tags: [sigil]
      summary: Get an analysis through its unguessable public link ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SimulateTransactionBody:
      type: object
      properties:
        rawData:
          type: string
          maxLength: 5000
          description: Raw transaction data — hex calldata, JSON tx object, or wallet prompt text
        network:
          type: string
          default: mainnet
        fromAddress:
          type: string
          description: Optional wallet address doing the signing
      required:
        - rawData

    SimulateTransactionV2Body:
      type: object
      additionalProperties: false
      required: [rawData]
      properties:
        rawData:
          type: string
          minLength: 1
          maxLength: 69632
          description: At most 68KiB UTF-8 input. JSON transaction keys are strictly to/from/data/value/gas; calldata at most 32KiB. Addresses are 20-byte hex; value/gas are canonical uint256 hex quantities. No endpoint or RPC method input. Prose/calldata without to is advisory only.
        network:
          type: string
          enum: [mainnet, polygon, arbitrum, optimism, base, bsc, goerli, sepolia]
          default: mainnet
        fromAddress:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
    ExecutionCapabilities:
      type: object
      additionalProperties: false
      required: [readOnlyCall, internalTraces, walletBalanceDeltas, storageSimulation, permissionState, historicalArchive]
      properties:
        readOnlyCall:
          type: boolean
        internalTraces:
          type: boolean
          enum: [false]
        walletBalanceDeltas:
          type: boolean
          enum: [false]
        storageSimulation:
          type: boolean
          enum: [false]
        permissionState:
          type: boolean
          enum: [false]
        historicalArchive:
          type: boolean
          enum: [false]
    SimulationReportBase:
      type: object
      required: [reportVersion, network, capabilities, limitations, summary]
      properties: &executionProperties
        reportVersion:
          type: string
          enum: [execution-check-v2]
        network:
          type: string
        capabilities:
          $ref: "#/components/schemas/ExecutionCapabilities"
        limitations:
          type: array
          maxItems: 8
          items:
            type: string
        summary:
          type: string
    SimulationCallCheck:
      type: object
      additionalProperties: false
      required: [reportVersion, network, capabilities, limitations, summary, assessmentStatus, callCheck]
      properties:
            <<: *executionProperties
            assessmentStatus:
              type: string
              enum: [call_check]
            callCheck:
              type: object
              additionalProperties: false
              required: [outcome, blockNumber, to]
              properties:
                outcome:
                  type: string
                  enum: [success]
                  description: eth_call returned bytes; RPC errors including revert remain unavailable
                blockNumber:
                  type: string
                  pattern: '^0x(?:0|[1-9a-fA-F][0-9a-fA-F]{0,63})$'
                to:
                  type: string
                  pattern: '^0x[0-9a-fA-F]{40}$'
                from:
                  type: string
                  pattern: '^0x[0-9a-fA-F]{40}$'
    SimulationAdvisoryOnly:
      type: object
      additionalProperties: false
      required: [reportVersion, network, capabilities, limitations, summary, assessmentStatus]
      properties:
            <<: *executionProperties
            assessmentStatus:
              type: string
              enum: [advisory_only]
    SimulationUnavailable:
      type: object
      additionalProperties: false
      required: [reportVersion, network, capabilities, limitations, summary, assessmentStatus]
      properties:
            <<: *executionProperties
            assessmentStatus:
              type: string
              enum: [unavailable]
    SimulationResultV2:
      oneOf:
        - $ref: "#/components/schemas/SimulationCallCheck"
        - $ref: "#/components/schemas/SimulationAdvisoryOnly"
        - $ref: "#/components/schemas/SimulationUnavailable"
      discriminator:
        propertyName: assessmentStatus
        mapping:
          call_check: "#/components/schemas/SimulationCallCheck"
          advisory_only: "#/components/schemas/SimulationAdvisoryOnly"
          unavailable: "#/components/schemas/SimulationUnavailable"

    SimulationAssetChange:
      type: object
      properties:
        direction:
          type: string
          enum: [lose, receive, approve]
        asset:
          type: string
          description: Token/asset name e.g. "USDC", "ETH", "NFT #1234"
        amount:
          type: string
          description: Human-readable amount e.g. "250", "unlimited", "0"
        usdValue:
          type: string
          description: Approximate USD value if known
      required:
        - direction
        - asset
        - amount

    SimulationResult:
      type: object
      properties:
        verdict:
          type: string
          enum: [safe, caution, dangerous]
        verdictReason:
          type: string
        summary:
          type: string
          description: One sentence of what this transaction does
        assetChanges:
          type: array
          items:
            $ref: "#/components/schemas/SimulationAssetChange"
          description: What will change in your wallet after signing
        permissionsGranted:
          type: array
          items:
            type: string
          description: Permissions/approvals being granted
        riskScore:
          type: number
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        warnings:
          type: array
          items:
            type: string
        inputType:
          type: string
          description: What kind of input was detected e.g. "ERC-20 approve calldata"
      required:
        - verdict
        - verdictReason
        - summary
        - assetChanges
        - permissionsGranted
        - riskScore
        - riskLevel
        - warnings
        - inputType

    AnalyzeInputBody:
      type: object
      properties:
        input:
          type: string
          description: Transaction hash (0x...) or contract address
        network:
          type: string
          description: Ethereum network (mainnet, goerli, etc.)
          default: mainnet
        fresh:
          type: boolean
          description: If true, bypass the cache and run a fresh analysis
      required:
        - input

    BreakdownAsset:
      type: object
      properties:
        asset:
          type: string
          description: Token symbol or name e.g. "USDC", "ETH", "NFT #1234"
        amount:
          type: string
          description: Human-readable amount e.g. "100", "0.05", "unlimited"
        usdValue:
          type: string
          description: Approximate USD value if known e.g. "~$100"
      required:
        - asset
        - amount

    BreakdownPermission:
      type: object
      properties:
        asset:
          type: string
        spender:
          type: string
          description: Who receives the permission
        amount:
          type: string
          description: How much access is granted
      required:
        - asset
        - spender
        - amount

    BreakdownRiskFactor:
      type: object
      properties:
        severity:
          type: string
          enum: [critical, high, medium, low, positive]
        label:
          type: string
          description: Short label e.g. "Unlimited approval"
        detail:
          type: string
          description: One sentence explanation
      required:
        - severity
        - label
        - detail

    TransactionBreakdown:
      type: object
      properties:
        actionType:
          type: string
          description: Machine-readable action type
          enum: [swap, approve, transfer, mint, burn, bridge, stake, deposit, withdraw, revoke, deploy, other]
        actionLabel:
          type: string
          description: Human-readable action label e.g. "Token Swap", "Token Approval"
        assetsOut:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownAsset"
          description: Assets leaving the wallet
        assetsIn:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownAsset"
          description: Assets entering the wallet
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownPermission"
          description: Permissions or approvals granted
        riskFactors:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownRiskFactor"
          description: Structured risk and trust factors with severity levels
      required:
        - actionType
        - actionLabel
        - assetsOut
        - assetsIn
        - permissions
        - riskFactors

    PriorApproval:
      type: object
      properties:
        id:
          type: string
        analyzedAt:
          type: string
          description: ISO timestamp when this approval was previously analyzed
        amountFormatted:
          type: string
        isUnlimited:
          type: boolean
        network:
          type: string
      required:
        - id
        - analyzedAt
        - amountFormatted
        - isUnlimited
        - network

    ApprovalInfo:
      type: object
      properties:
        isApproval:
          type: boolean
        isRevoke:
          type: boolean
          description: True if approval amount is 0 (removing access)
        approvalType:
          type: string
          description: "approve or increaseAllowance"
        spender:
          type: string
          description: Address receiving the spending permission
        spenderEntity:
          $ref: "#/components/schemas/KnownEntity"
          description: Known entity for the spender address if recognized
        tokenContract:
          type: string
          description: The token contract address being approved
        tokenEntity:
          $ref: "#/components/schemas/KnownEntity"
          description: Known entity for the token contract if recognized
        amountFormatted:
          type: string
          description: Human-readable amount e.g. "Unlimited" or "500.00"
        isUnlimited:
          type: boolean
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        priorApprovals:
          type: array
          items:
            $ref: "#/components/schemas/PriorApproval"
          description: Previously analyzed approvals for the same spender
        tokenPriceUsd:
          type: number
          description: Current USD price per token from CoinGecko
        approvalAmountUsd:
          type: string
          description: Human-readable USD value of the approval, or unlimited
        approvalUsdLabel:
          type: string
          description: Short display label for the dollar context
      required:
        - isApproval
        - isRevoke
        - approvalType
        - spender
        - tokenContract
        - amountFormatted
        - isUnlimited
        - riskLevel
        - priorApprovals

    KnownEntity:
      type: object
      properties:
        name:
          type: string
          description: Human-readable protocol name e.g. "Uniswap V3 Router"
        category:
          type: string
          description: Protocol category e.g. "DEX", "Lending", "NFT Marketplace"
        trustLevel:
          type: string
          enum: [trusted, caution, unknown]
        url:
          type: string
          description: Protocol website URL
        description:
          type: string
          description: Short description of what the protocol does
        logoLetter:
          type: string
          description: Single letter to use as logo placeholder
      required:
        - name
        - category
        - trustLevel
        - url
        - description
        - logoLetter

    ReputationFactor:
      type: object
      properties:
        name:
          type: string
          description: Factor name e.g. "Contract Age"
        earned:
          type: number
          description: Points earned for this factor
        max:
          type: number
          description: Maximum possible points for this factor
        label:
          type: string
          description: Human-readable label e.g. "Deployed 2 years ago"
        verdict:
          type: string
          enum: [positive, neutral, negative]
      required:
        - name
        - earned
        - max
        - label
        - verdict

    PatternMatch:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [drainer, honeypot, fake_approval, rug_pull, phishing, flash_loan, suspicious, unknown]
        name:
          type: string
        confidence:
          type: string
          enum: [confirmed, high, medium, low]
        description:
          type: string
        indicators:
          type: array
          items:
            type: string
        historicalContext:
          type: string
        riskDelta:
          type: number
          description: How much this pattern adds to the risk score
      required:
        - id
        - type
        - name
        - confidence
        - description
        - indicators
        - riskDelta

    ScoreFactor:
      type: object
      properties:
        label:
          type: string
        delta:
          type: number
          description: Positive raises risk; negative lowers risk
        severity:
          type: string
          enum: [critical, high, medium, positive]
        category:
          type: string
          enum: [approval, contract, pattern, reputation, entity]
        detail:
          type: string
      required:
        - label
        - delta
        - severity
        - category

    ContractReputation:
      type: object
      properties:
        trustScore:
          type: number
          description: Trust score from 0 (untrusted) to 100 (fully trusted)
        tier:
          type: string
          enum: [new, unproven, emerging, established, trusted, exploited]
          description: Human tier classification
        tierLabel:
          type: string
          description: Short uppercase label e.g. "TRUSTED"
        tierDescription:
          type: string
          description: One sentence description of what the tier means
        summary:
          type: string
          description: Plain-English "credit score" verdict for this contract
        isExploited:
          type: boolean
          description: Whether this contract is in the known exploit registry
        exploitInfo:
          type: object
          properties:
            name:
              type: string
            lostUSD:
              type: string
            date:
              type: string
        ageInDays:
          type: number
        deployedAt:
          type: string
          description: ISO date string of contract deployment
        deployerAddress:
          type: string
        txCountEstimate:
          type: number
          description: Estimated number of transactions (lower bound)
        hasRecentActivity:
          type: boolean
        factors:
          type: array
          items:
            $ref: "#/components/schemas/ReputationFactor"
      required:
        - trustScore
        - tier
        - tierLabel
        - tierDescription
        - summary
        - isExploited
        - factors

    AnalysisResult:
      type: object
      properties:
        id:
          type: string
        input:
          type: string
        inputType:
          type: string
          enum: [transaction, contract, unknown]
        network:
          type: string
        summary:
          type: string
          description: Plain English summary of what this does
        verdict:
          type: string
          enum: [safe, caution, dangerous]
          description: Should I sign this? clear decision
        verdictReason:
          type: string
          description: Short reason for the verdict e.g. "Grants unlimited spending to an unverified contract"
        riskScore:
          type: number
          description: Risk score from 0 (safe) to 100 (very risky)
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        warnings:
          type: array
          items:
            type: string
        positives:
          type: array
          items:
            type: string
        knownEntity:
          $ref: "#/components/schemas/KnownEntity"
          description: Identified known protocol if the target address is a recognized contract
        approvalInfo:
          $ref: "#/components/schemas/ApprovalInfo"
          description: Decoded approval details if this is a token approval transaction
        breakdown:
          $ref: "#/components/schemas/TransactionBreakdown"
          description: Structured visual breakdown of the transaction for dashboard display
        reputation:
          $ref: "#/components/schemas/ContractReputation"
          description: Contract reputation / trust score (only present for contract address inputs)
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/PatternMatch"
          description: Detected scam / exploit patterns
        scoreFactors:
          type: array
          items:
            $ref: "#/components/schemas/ScoreFactor"
          description: Deterministic factors that explain what drove the risk score
        details:
          $ref: "#/components/schemas/AnalysisDetails"
        createdAt:
          type: string
        cached:
          type: boolean
          description: True when this result was served from the in-memory cache
      required:
        - id
        - input
        - inputType
        - network
        - summary
        - verdict
        - verdictReason
        - riskScore
        - riskLevel
        - warnings
        - positives
        - createdAt

    AnalysisDetails:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        value:
          type: string
        gasUsed:
          type: string
        methodName:
          type: string
        contractName:
          type: string
        tokenSymbol:
          type: string
        rawData:
          type: object

    AnalysisRecord:
      type: object
      properties:
        id:
          type: string
        input:
          type: string
        inputType:
          type: string
          enum: [transaction, contract, unknown]
        network:
          type: string
        summary:
          type: string
        verdict:
          type: string
          enum: [safe, caution, dangerous]
        verdictReason:
          type: string
        riskScore:
          type: number
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        warnings:
          type: array
          items:
            type: string
        positives:
          type: array
          items:
            type: string
        createdAt:
          type: string
        details:
          $ref: "#/components/schemas/AnalysisDetails"
        hallOfShame:
          type: boolean
          description: True when this is a pre-curated Hall of Shame entry
        hallOfShameLabel:
          type: string
          description: Display label for Hall of Shame entries e.g. "Ronin Bridge · $625M"
      required:
        - id
        - input
        - inputType
        - network
        - summary
        - verdict
        - verdictReason
        - riskScore
        - riskLevel
        - warnings
        - positives
        - createdAt

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
