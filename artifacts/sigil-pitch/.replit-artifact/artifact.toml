kind = "slides"
previewPath = "/sigil-pitch/"
title = "Sigil — Hackathon Pitch Deck"
version = "1.0.0"
id = "artifacts/sigil-pitch"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sigil-pitch/" ]
localPort = 23163

[services.development]
run = "pnpm --filter @workspace/sigil-pitch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sigil-pitch", "run", "build" ]
publicDir = "artifacts/sigil-pitch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23163"
BASE_PATH = "/sigil-pitch/"
