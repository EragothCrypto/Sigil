<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigil</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 520px;
      background: #090b12;
      color: white;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .glow-bar {
      height: 2px;
      background: linear-gradient(90deg, transparent, #00f5d4 28%, #8b5cf6 70%, transparent);
    }

    .shell { max-height: 600px; overflow: auto; }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #00f5d4, #8b5cf6);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      color: #090b12;
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 15px;
      color: #00f5d4;
      letter-spacing: 0.12em;
    }

    .logo-tagline {
      font-size: 10px;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.05em;
      margin-top: 1px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
    }

    .sub {
      font-size: 11px;
      line-height: 1.4;
      color: rgba(255,255,255,0.42);
      margin-top: 3px;
    }

    .toggle {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 99px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.2s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.45);
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: all 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: rgba(0,245,212,0.2);
      border-color: rgba(0,245,212,0.5);
    }

    .toggle input:checked + .toggle-track::after {
      left: 19px;
      background: #00f5d4;
    }

    .section {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .section-label {
      font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .field, .select, .textarea {
      width: 100%;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      color: rgba(255,255,255,0.78);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .field, .select { padding: 9px 11px; font-size: 11.5px; }
    .field, .textarea { font-family: 'JetBrains Mono', monospace; }
    .textarea { min-height: 58px; resize: vertical; padding: 10px 11px; font-size: 11px; line-height: 1.45; }
    .field:focus, .select:focus, .textarea:focus { border-color: rgba(0,245,212,0.45); background: rgba(255,255,255,0.075); }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .mode-btn {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.045);
      color: rgba(255,255,255,0.62);
      border-radius: 9px;
      padding: 9px 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .mode-btn.active {
      color: #00f5d4;
      border-color: rgba(0,245,212,0.38);
      background: rgba(0,245,212,0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
    }

    .save-btn, .ghost-btn, .open-app-btn {
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.15s;
    }

    .save-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: rgba(0,245,212,0.1);
      border: 1px solid rgba(0,245,212,0.28);
      color: #00f5d4;
    }

    .ghost-btn {
      padding: 8px 10px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.68);
    }

    .save-btn:hover, .open-app-btn:hover { background: rgba(0,245,212,0.18); }
    .ghost-btn:hover { background: rgba(255,255,255,0.08); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.045);
      color: rgba(255,255,255,0.68);
      font: 600 10.5px 'JetBrains Mono', monospace;
      padding: 5px 8px;
    }

    .chip button {
      width: 14px;
      height: 14px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      line-height: 14px;
      font-size: 10px;
      padding: 0;
    }

    .history {
      display: grid;
      gap: 7px;
      max-height: 150px;
      overflow: auto;
    }

    .sessions {
      display: grid;
      gap: 7px;
      max-height: 170px;
      overflow: auto;
    }

    .history-item {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9px;
      background: rgba(255,255,255,0.035);
      padding: 8px 9px;
    }

    .session-item {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9px;
      background: rgba(255,255,255,0.035);
      padding: 9px;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .session-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .history-site {
      color: rgba(255,255,255,0.8);
      font-size: 11.5px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-site {
      color: rgba(255,255,255,0.82);
      font-size: 11.5px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill {
      flex: 0 0 auto;
      border-radius: 99px;
      padding: 2px 7px;
      font: 700 10px 'JetBrains Mono', monospace;
      text-transform: uppercase;
    }

    .safe { color: #86efac; background: rgba(34,197,94,0.12); }
    .caution { color: #fde68a; background: rgba(245,158,11,0.13); }
    .dangerous { color: #fca5a5; background: rgba(239,68,68,0.14); }

    .site-result {
      margin-top: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9px;
      background: rgba(255,255,255,0.035);
      padding: 9px;
    }

    .site-result-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .site-host {
      color: rgba(255,255,255,0.78);
      font: 700 11px 'JetBrains Mono', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .site-summary {
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      line-height: 1.4;
    }

    .paste-result {
      margin-top: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9px;
      background: rgba(255,255,255,0.035);
      padding: 9px;
    }

    .paste-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .paste-kind {
      color: rgba(255,255,255,0.82);
      font: 800 11px 'JetBrains Mono', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .paste-summary {
      color: rgba(255,255,255,0.52);
      font-size: 11px;
      line-height: 1.4;
    }

    .paste-output {
      margin-top: 7px;
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      line-height: 1.4;
    }

    .history-meta {
      color: rgba(255,255,255,0.38);
      font: 600 10px 'JetBrains Mono', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      margin-top: 7px;
    }

    .session-stat {
      border-radius: 7px;
      background: rgba(255,255,255,0.045);
      padding: 5px 4px;
      text-align: center;
    }

    .session-stat strong {
      display: block;
      color: rgba(255,255,255,0.86);
      font: 800 12px 'JetBrains Mono', monospace;
    }

    .session-stat span {
      display: block;
      margin-top: 1px;
      color: rgba(255,255,255,0.36);
      font-size: 8.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .empty {
      color: rgba(255,255,255,0.38);
      font-size: 11.5px;
      padding: 8px 0 2px;
    }

    .open-app-btn {
      display: block;
      margin: 14px 18px 18px;
      padding: 11px;
      background: linear-gradient(135deg, rgba(0,245,212,0.12), rgba(139,92,246,0.1));
      border: 1px solid rgba(0,245,212,0.25);
      color: #00f5d4;
      text-align: center;
      text-decoration: none;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      margin-right: 6px;
      animation: pulse-dot 2s infinite;
    }

    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: rgba(0,245,212,0.15);
      border: 1px solid rgba(0,245,212,0.3);
      color: #00f5d4;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition: transform 0.25s, opacity 0.25s;
      opacity: 0;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="glow-bar"></div>
  <div class="shell">
    <div class="header">
      <div class="logo-icon">S</div>
      <div>
        <div class="logo-text">SIGIL</div>
        <div class="logo-tagline">Daily wallet protection</div>
      </div>
    </div>

    <div class="toggle-row">
      <div>
        <div class="label"><span class="status-dot"></span>Transaction Guard</div>
        <div class="sub">Intercept signing requests before your wallet opens</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enabledToggle" checked />
        <span class="toggle-track"></span>
      </label>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-label">Protection Mode</div>
      </div>
      <div class="mode-grid" id="modeGrid">
        <button class="mode-btn" data-mode="quiet" type="button">Quiet</button>
        <button class="mode-btn" data-mode="standard" type="button">Standard</button>
        <button class="mode-btn" data-mode="strict" type="button">Strict</button>
      </div>
      <div class="sub" id="modeDescription"></div>
    </div>

    <div class="section">
      <div class="section-label">API Endpoint</div>
      <input class="field" type="text" id="apiUrlInput" placeholder="https://your-sigil-api.example" />
      <button class="save-btn" id="saveBtn" type="button">Save Settings</button>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-label">Site Reputation</div>
        <button class="ghost-btn" id="checkSiteBtn" type="button">Check</button>
      </div>
      <input class="field" type="text" id="siteCheckInput" placeholder="app.example.xyz" />
      <div id="siteResult"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-label">Copy/Paste Analyzer</div>
        <button class="ghost-btn" id="pasteAnalyzeBtn" type="button">Analyze</button>
      </div>
      <textarea class="textarea" id="pasteInput" placeholder="Paste an address, tx hash, calldata, URL, or typed data"></textarea>
      <div id="pasteResult"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-label">Trusted Sites</div>
        <button class="ghost-btn" id="addSiteBtn" type="button">Add</button>
      </div>
      <div class="row">
        <input class="field" type="text" id="trustedSiteInput" placeholder="app.example.xyz" />
      </div>
      <div class="chips" id="trustedSites"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-label">Trusted Contracts</div>
        <button class="ghost-btn" id="addContractBtn" type="button">Add</button>
      </div>
      <input class="field" type="text" id="trustedContractInput" placeholder="0x..." />
      <div class="chips" id="trustedContracts"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-label">Recent Checks</div>
        <button class="ghost-btn" id="clearHistoryBtn" type="button">Clear</button>
      </div>
      <div class="history" id="historyList"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-label">dApp Sessions</div>
      </div>
      <div class="sessions" id="sessionList"></div>
    </div>

    <a class="open-app-btn" id="openAppBtn" href="#" target="_blank" rel="noopener">Open Sigil Scanner</a>
  </div>

  <div class="toast" id="toast">Saved</div>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
