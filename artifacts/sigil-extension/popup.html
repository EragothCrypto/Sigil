<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 200px;
      background: #0a0b0f;
      color: white;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
    }

    .glow-bar {
      height: 2px;
      background: linear-gradient(90deg, transparent, #00f5d4 40%, #00b4d8 60%, transparent);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #00f5d4, #00b4d8);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      color: #0a0b0f;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 15px;
      color: #00f5d4;
      letter-spacing: 0.12em;
    }

    .logo-tagline {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
      margin-top: 1px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
    }

    .toggle-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 2px;
    }

    .toggle {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 99px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: all 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: rgba(0,245,212,0.2);
      border-color: rgba(0,245,212,0.5);
    }

    .toggle input:checked + .toggle-track::after {
      left: 19px;
      background: #00f5d4;
    }

    .section {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .section-label {
      font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .api-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.7);
      outline: none;
      transition: border-color 0.15s;
    }
    .api-input:focus { border-color: rgba(0,245,212,0.4); }

    .save-btn {
      width: 100%;
      margin-top: 8px;
      padding: 9px;
      background: rgba(0,245,212,0.1);
      border: 1px solid rgba(0,245,212,0.25);
      border-radius: 8px;
      color: #00f5d4;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
    }
    .save-btn:hover { background: rgba(0,245,212,0.18); }

    .open-app-btn {
      display: block;
      margin: 14px 18px 18px;
      padding: 11px;
      background: linear-gradient(135deg, rgba(0,245,212,0.12), rgba(0,180,216,0.08));
      border: 1px solid rgba(0,245,212,0.25);
      border-radius: 12px;
      color: #00f5d4;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.15s;
    }
    .open-app-btn:hover { background: linear-gradient(135deg, rgba(0,245,212,0.2), rgba(0,180,216,0.14)); }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      margin-right: 6px;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: rgba(0,245,212,0.15);
      border: 1px solid rgba(0,245,212,0.3);
      color: #00f5d4;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: transform 0.25s;
      opacity: 0;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="glow-bar"></div>

  <div class="header">
    <div class="logo-icon">S</div>
    <div>
      <div class="logo-text">SIGIL</div>
      <div class="logo-tagline">The Trust Layer of Web3</div>
    </div>
  </div>

  <div class="toggle-row">
    <div>
      <div class="toggle-label"><span class="status-dot"></span>Transaction Guard</div>
      <div class="toggle-sub">Intercept & analyze before signing</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="enabledToggle" checked />
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="section">
    <div class="section-label">API Endpoint</div>
    <input class="api-input" type="text" id="apiUrlInput" placeholder="https://your-sigil-api.replit.app" />
    <button class="save-btn" id="saveBtn">Save Settings</button>
  </div>

  <a class="open-app-btn" id="openAppBtn" href="#" target="_blank">Open Sigil Scanner ↗</a>

  <div class="toast" id="toast">Saved!</div>

  <script src="popup.js"></script>
</body>
</html>
